# Fichier : ansible/ansible.cfg
# Rôle    : réglages Ansible du projet (remplacent /etc/ansible/ansible.cfg)
# Utilise : hosts
# Utilisé par : ansible et ansible-playbook lancés depuis le dossier ansible/

[defaults]
# Inventaire par défaut : plus besoin de -i hosts (gardé dans l'énoncé)
inventory = hosts
# Vérifie l'empreinte SSH des machines (protection contre l'usurpation)
host_key_checking = True
