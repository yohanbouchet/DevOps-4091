# Fichier : load-balancing/haproxy/haproxy.cfg
# Rôle    : répartit les requêtes entre webserver1 et webserver2, écarte un
#           serveur en panne, expose une page de statistiques
# Utilise : services webserver1 et webserver2 du compose.yaml
# Utilisé par : conteneur haproxy (compose.yaml)

global
  # Nombre maximal de connexions simultanées pour tout HAProxy
  maxconn 100
  # Journaux envoyés sur la sortie standard (lus avec docker compose logs)
  log stdout format raw local0

defaults
  mode http
  log global
  # Journal détaillé de chaque requête HTTP (serveur choisi, durée, code)
  option httplog
  # Ne journalise pas les connexions vides (sondes)
  option dontlognull
  # Délais : connexion au serveur, client inactif, serveur trop lent,
  # requête trop longue
  timeout connect 5s
  timeout client 10s
  timeout server 10s
  timeout http-request 10s
  # Si un serveur échoue : 3 essais, puis bascule vers un autre serveur
  # (failover)
  retries 3
  option redispatch

# Point d'entrée : reçoit les visiteurs sur le port 80 du conteneur
frontend web_front
  bind *:80
  default_backend web_servers

# Groupe de serveurs : chacun à son tour (round robin), avec contrôle
# de santé
backend web_servers
  balance roundrobin
  # Contrôle de santé HTTP : GET / doit répondre 200
  option httpchk
  http-check send meth GET uri /
  http-check expect status 200
  # check : contrôle toutes les 2 s ; 3 échecs = hors service ;
  # 2 succès = de retour
  default-server check inter 2s fall 3 rise 2
  server web1 webserver1:80
  server web2 webserver2:80

# Page de statistiques (état des serveurs en direct), rafraîchie
# toutes les 5 s
frontend stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
